# hyprlock — rice Art Nouveau "Mucha"
# Mockup: artboard "Bloqueio (hyprlock) e login (SDDM)"
# Posições em px lógicos (1280x720 @1.5), relativas ao centro da tela.
# O cartão em arco é gerado por ~/.config/rice/gen/cartao-bloqueio.py

$assets = ~/.config/rice/assets
$scripts = ~/.config/hypr/scripts
$display = Federant
$ui = Alegreya Sans
$x = 220

$tinta = rgb(3A3328)
$tinta_suave = rgb(6E6553)
$pergaminho = rgb(EFE6D2)
$cobre = rgb(B0683A)
$cobre_escuro = rgb(8A4B26)
$ouro = rgb(B8955A)
$borda = rgb(6E3C1E)

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Toque o leitor ou digite a senha
        present_message = Lendo a digital…
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = suave, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, suave
    animation = fadeOut, 1, 4, suave
    animation = inputFieldDots, 1, 2, suave
}

background {
    monitor =
    path = $assets/wallpaper.webp
    blur_passes = 0
}

# cartão em arco
image {
    monitor =
    path = $assets/cartao-bloqueio.png
    size = 402
    rounding = 0
    border_size = 0
    position = $x, 2
    halign = center
    valign = center
    zindex = 0
}

# avatar (medalhão)
image {
    monitor =
    path = $assets/avatar.png
    size = 92
    rounding = -1
    border_size = 1
    border_color = $borda
    position = $x, 132
    halign = center
    valign = center
    zindex = 1
}

# relógio
label {
    monitor =
    text = $TIME
    color = $tinta
    font_size = 64
    font_family = $display
    position = $x, 45
    halign = center
    valign = center
    zindex = 1
}

# data
label {
    monitor =
    text = cmd[update:60000] $scripts/data-pt.sh
    color = $tinta_suave
    font_size = 14
    font_family = $ui
    position = $x, -3
    halign = center
    valign = center
    zindex = 1
}

# usuário (dentro da cartela)
label {
    monitor =
    text = <b>$USER</b>
    color = $tinta
    font_size = 13
    font_family = $ui
    position = $x, -43
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 252, 39
    outline_thickness = 1
    rounding = -1
    outer_color = $cobre
    inner_color = $pergaminho
    font_color = $tinta
    font_family = $ui
    check_color = $ouro
    fail_color = $cobre_escuro
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##6E6553" size="13pt">$FPRINTPROMPT</span>
    fail_text = <span foreground="##8A4B26" size="13pt">$FAIL</span>
    capslock_color = $ouro
    position = $x, -84
    halign = center
    valign = center
    zindex = 1
}

# bateria (no lugar do botão de energia do mockup, que não é clicável aqui)
label {
    monitor =
    text = cmd[update:30000] $scripts/bateria.sh
    color = $tinta_suave
    font_size = 12
    font_family = $ui
    position = $x, -170
    halign = center
    valign = center
    zindex = 1
}
