# (gerado de cores-dia.conf por rice/gen/noite.py — não edite à mão)
# tmux — cores do rice Mucha (dia). A versão noite é gerada por rice/gen/noite.py;
# ~/.config/tmux/cores.conf aponta para a ativa (hypr/scripts/tema.sh).
set -g status-style "bg=default,fg=#ADA087"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#1E1A15,bg=#E0A070,bold] #S #[bg=default] "
set -g status-right "#[fg=#ADA087]#{?client_prefix,#[fg=#E0A070#,bold]prefixo  ,}#[fg=#AFC29C]#{b:pane_current_path}  #[fg=#ADA087]%H:%M "
setw -g window-status-format "#[fg=#ADA087] #I #W "
setw -g window-status-current-format "#[fg=#E6DAC2,bg=#34402F,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#4A4034"
set -g pane-active-border-style "fg=#CC8550"
set -g pane-border-lines single

set -g message-style "bg=#26211A,fg=#E6DAC2"
set -g message-command-style "bg=#26211A,fg=#E6DAC2"
setw -g mode-style "bg=#34402F,fg=#E6DAC2"
set -g copy-mode-match-style "bg=#3A3328,fg=#E6DAC2"
set -g copy-mode-current-match-style "bg=#B39459,fg=#E6DAC2"
setw -g clock-mode-colour "#E0A070"
set -g display-panes-active-colour "#CC8550"
set -g display-panes-colour "#B39459"
