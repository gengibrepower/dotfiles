# tmux — rice Art Nouveau "Mucha"
# Paleta: pergaminho EFE6D2 · creme F7F1E3 · tinta 3A3328 · tinta suave 6E6553
#         sálvia 8A9A7B / DCE3D2 / 4F5E45 · cobre B0683A / 8A4B26 · ouro B8955A

# ---- básico ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,*256col*:RGB"
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi

# ---- atalhos (prefixo: Ctrl+Espaço, como no Omarchy) ----
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "config recarregada"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# ---- aparência ----
# fundo "default" deixa a transparência do Ghostty aparecer
set -g status-position top
set -g status-justify left
# cores: ~/.config/tmux/cores.conf → cores-dia/cores-noite (troca com o tema)
source-file -q ~/.config/tmux/cores.conf

# ---- abas (janelas) sem prefixo ----
# Alt+1..9 vai direto para a aba; Alt+h/l (ou Ctrl+Shift+h/l) anterior/próxima.
# Ctrl+Shift+letra só chega ao tmux com extended keys (CSI u), que o Ghostty envia.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n C-S-h previous-window
bind -n C-S-l next-window
bind -n M-h previous-window
bind -n M-l next-window
