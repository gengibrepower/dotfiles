# tmux — rice Art Nouveau "Mucha"
# Paleta: pergaminho EFE6D2 · creme F7F1E3 · tinta 3A3328 · tinta suave 6E6553
#         sálvia 8A9A7B / DCE3D2 / 4F5E45 · cobre B0683A / 8A4B26 · ouro B8955A

# ---- básico ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,*256col*:RGB"
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi

# ---- atalhos (prefixo: Alt+Espaço, como no Omarchy) ----
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "config recarregada"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# ---- aparência ----
# fundo "default" deixa a transparência do Ghostty aparecer
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#6E6553"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#F7F1E3,bg=#8A4B26,bold] #S #[bg=default] "
set -g status-right "#[fg=#6E6553]#{?client_prefix,#[fg=#8A4B26#,bold]prefixo  ,}#[fg=#4F5E45]#{b:pane_current_path}  #[fg=#6E6553]%H:%M "
setw -g window-status-format "#[fg=#6E6553] #I #W "
setw -g window-status-current-format "#[fg=#3A3328,bg=#DCE3D2,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#D5C7A8"
set -g pane-active-border-style "fg=#B0683A"
set -g pane-border-lines single

set -g message-style "bg=#EFE6D2,fg=#3A3328"
set -g message-command-style "bg=#EFE6D2,fg=#3A3328"
setw -g mode-style "bg=#DCE3D2,fg=#3A3328"
set -g copy-mode-match-style "bg=#E2D7BF,fg=#3A3328"
set -g copy-mode-current-match-style "bg=#B8955A,fg=#3A3328"
setw -g clock-mode-colour "#8A4B26"
set -g display-panes-active-colour "#B0683A"
set -g display-panes-colour "#B8955A"
